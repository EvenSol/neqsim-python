name: Generate Java Stubs

on:
  # Run when JAR files are updated
  push:
    paths:
      - 'src/neqsim/lib/*.jar'
  # Run on release
  release:
    types: [published]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate-stubs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Generate stubs
        run: |
          uv run python scripts/generate_stubs.py

      - name: Generate offline API manifest
        run: |
          uv run python scripts/generate_api_manifest.py

      - name: Commit updated stubs and manifest
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: regenerate Java stubs and API manifest"
          file_pattern: "src/jneqsim-stubs/**/*.pyi src/neqsim/data/neqsim_api.json.gz"
